# betterleaks (gitleaks-compatible) configuration.
title = "animation-grabber"

[extend]
useDefault = true

[allowlist]
description = "Generated or vendored files that never hold secrets"
paths = [
  '''pnpm-lock\.yaml''',
  '''\.output/''',
  '''dist/''',
  '''\.wxt/''',
  '''node_modules/''',
  '''coverage/''',
]
